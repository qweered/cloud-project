version: '3.8'

services:
  users-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/carpool-users:${IMAGE_TAG:-latest}
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=${POSTGRES_SERVER}.postgres.database.azure.com
      - DB_NAME=users_db
      - DB_USER=${POSTGRES_ADMIN_USER}@${POSTGRES_SERVER}
      - DB_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - ENVIRONMENT=production
    depends_on:
      - rabbitmq
    networks:
      - carpool-network
    restart: unless-stopped

  rides-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/carpool-rides:${IMAGE_TAG:-latest}
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=${POSTGRES_SERVER}.postgres.database.azure.com
      - DB_NAME=rides_db
      - DB_USER=${POSTGRES_ADMIN_USER}@${POSTGRES_SERVER}
      - DB_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - ENVIRONMENT=production
    depends_on:
      - rabbitmq
    networks:
      - carpool-network
    restart: unless-stopped

  matching-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/carpool-matching:${IMAGE_TAG:-latest}
    ports:
      - "8003:8000"
    environment:
      - USERS_SERVICE_URL=http://users-service:8000
      - RIDES_SERVICE_URL=http://rides-service:8000
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - ENVIRONMENT=production
    depends_on:
      - users-service
      - rides-service
      - rabbitmq
    networks:
      - carpool-network
    restart: unless-stopped

  payments-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/carpool-payments:${IMAGE_TAG:-latest}
    ports:
      - "8004:8000"
    environment:
      - DB_HOST=${POSTGRES_SERVER}.postgres.database.azure.com
      - DB_NAME=payments_db
      - DB_USER=${POSTGRES_ADMIN_USER}@${POSTGRES_SERVER}
      - DB_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - ENVIRONMENT=production
    depends_on:
      - rabbitmq
    networks:
      - carpool-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-admin123}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - carpool-network
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

networks:
  carpool-network:
    driver: bridge

volumes:
  rabbitmq-data: 