name: Carpooling Services CI/CD Pipeline

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users, rides, matching, payments]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        cd services/${{ matrix.service }}
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Lint with flake8
      run: |
        cd services/${{ matrix.service }}
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        cd services/${{ matrix.service }}
        # If tests are present, run them
        if [ -d "tests" ]; then
          pytest
        else
          echo "No tests found for ${{ matrix.service }} service"
        fi
    
    - name: Build Docker image
      run: |
        cd services/${{ matrix.service }}
        docker build -t carpooling/${{ matrix.service }}:${{ github.sha }} .
    
    - name: Save Docker image
      run: |
        docker save carpooling/${{ matrix.service }}:${{ github.sha }} > ${{ matrix.service }}.tar
    
    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-image
        path: ${{ matrix.service }}.tar

  deploy:
    name: Deploy Services
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Download all Docker images
      uses: actions/download-artifact@v4
      with:
        path: ./images
    
    - name: Load Docker images
      run: |
        for service in users rides matching payments; do
          docker load < ./images/${service}-image/${service}.tar
        done
    
    - name: Set up Docker Compose
      run: |
        docker compose -f docker-compose.yml up -d
    
    - name: Deploy to production
      run: |
        # In a real production environment, this might:
        # - Deploy to Kubernetes, AWS ECS, or another container platform
        # - Update environment variables for production
        # - Run database migrations
        # - Notify monitoring systems
        echo "Deployment completed successfully" 
