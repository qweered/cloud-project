name: Deploy to Azure

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]

env:
  RESOURCE_GROUP: rg-carpool-app
  LOCATION: eastus
  ACR_NAME: carpoolacr
  REGISTRY: carpoolacr.azurecr.io

jobs:
  setup-acr:
    name: Setup Azure Container Registry
    runs-on: ubuntu-latest
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }
    
    - name: Create Azure Container Registry
      run: |
        # Create ACR if it doesn't exist
        if ! az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null; then
          echo "Creating Azure Container Registry..."
          az acr create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.ACR_NAME }} \
            --sku Basic \
            --admin-enabled true
        else
          echo "ACR already exists"
        fi
    
    - name: Import base images to ACR
      run: |
        echo "Importing base images to ACR..."
        # Import RabbitMQ image
        az acr import \
          --name ${{ env.ACR_NAME }} \
          --source docker.io/rabbitmq:3-management \
          --image rabbitmq:3-management \
          --force || echo "RabbitMQ import failed, will retry later"

  build-and-push:
    name: Build and Push to ACR
    needs: setup-acr
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users, rides, matching, payments]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }
    
    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ env.ACR_NAME }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./services/${{ matrix.service }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/carpool-${{ matrix.service }}:${{ github.sha }}
          ${{ env.REGISTRY }}/carpool-${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users, rides, matching, payments]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        cd services/${{ matrix.service }}
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Lint with flake8
      run: |
        cd services/${{ matrix.service }}
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        cd services/${{ matrix.service }}
        if [ -d "tests" ]; then
          pytest
        else
          echo "No tests found for ${{ matrix.service }} service"
        fi

  deploy:
    name: Deploy to Azure
    needs: [setup-acr, build-and-push, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }

    - name: Deploy RabbitMQ Container
      run: |
        # Login to ACR for deployment
        az acr login --name ${{ env.ACR_NAME }}
        
        # Deploy RabbitMQ from ACR
        az container create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name rabbitmq \
          --image ${{ env.REGISTRY }}/rabbitmq:3-management \
          --dns-name-label carpool-rabbitmq-${{ github.run_number }} \
          --ports 5672 15672 \
          --location ${{ env.LOCATION }} \
          --os-type Linux \
          --cpu 1 \
          --memory 1.5 \
          --restart-policy Always \
          --registry-login-server ${{ env.REGISTRY }} \
          --registry-username ${{ env.ACR_NAME }} \
          --registry-password $(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv) \
          --environment-variables \
            RABBITMQ_DEFAULT_USER=admin \
            RABBITMQ_DEFAULT_PASS=admin123

    - name: Deploy Users Service
      run: |
        az container create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name users-service \
          --image ${{ env.REGISTRY }}/carpool-users:${{ github.sha }} \
          --dns-name-label carpool-users-${{ github.run_number }} \
          --ports 8000 \
          --location ${{ env.LOCATION }} \
          --os-type Linux \
          --cpu 0.5 \
          --memory 1 \
          --restart-policy Always \
          --registry-login-server ${{ env.REGISTRY }} \
          --registry-username ${{ env.ACR_NAME }} \
          --registry-password $(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv) \
          --environment-variables \
            DB_HOST=${{ secrets.POSTGRES_SERVER }}.postgres.database.azure.com \
            DB_NAME=users_db \
            DB_USER=${{ secrets.POSTGRES_ADMIN_USER }}@${{ secrets.POSTGRES_SERVER }} \
            DB_PASSWORD=${{ secrets.POSTGRES_ADMIN_PASSWORD }} \
            RABBITMQ_HOST=rabbitmq.containerinstances.io

    - name: Deploy Rides Service
      run: |
        az container create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name rides-service \
          --image ${{ env.REGISTRY }}/carpool-rides:${{ github.sha }} \
          --dns-name-label carpool-rides-${{ github.run_number }} \
          --ports 8000 \
          --location ${{ env.LOCATION }} \
          --os-type Linux \
          --cpu 0.5 \
          --memory 1 \
          --restart-policy Always \
          --registry-login-server ${{ env.REGISTRY }} \
          --registry-username ${{ env.ACR_NAME }} \
          --registry-password $(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv) \
          --environment-variables \
            DB_HOST=${{ secrets.POSTGRES_SERVER }}.postgres.database.azure.com \
            DB_NAME=rides_db \
            DB_USER=${{ secrets.POSTGRES_ADMIN_USER }}@${{ secrets.POSTGRES_SERVER }} \
            DB_PASSWORD=${{ secrets.POSTGRES_ADMIN_PASSWORD }} \
            RABBITMQ_HOST=rabbitmq.containerinstances.io

    - name: Deploy Payments Service
      run: |
        az container create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name payments-service \
          --image ${{ env.REGISTRY }}/carpool-payments:${{ github.sha }} \
          --dns-name-label carpool-payments-${{ github.run_number }} \
          --ports 8000 \
          --location ${{ env.LOCATION }} \
          --os-type Linux \
          --cpu 0.5 \
          --memory 1 \
          --restart-policy Always \
          --registry-login-server ${{ env.REGISTRY }} \
          --registry-username ${{ env.ACR_NAME }} \
          --registry-password $(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv) \
          --environment-variables \
            DB_HOST=${{ secrets.POSTGRES_SERVER }}.postgres.database.azure.com \
            DB_NAME=payments_db \
            DB_USER=${{ secrets.POSTGRES_ADMIN_USER }}@${{ secrets.POSTGRES_SERVER }} \
            DB_PASSWORD=${{ secrets.POSTGRES_ADMIN_PASSWORD }} \
            RABBITMQ_HOST=rabbitmq.containerinstances.io

    - name: Wait for services to be ready
      run: |
        echo "Waiting for services to start..."
        sleep 60

    - name: Deploy Matching Service
      run: |
        az container create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name matching-service \
          --image ${{ env.REGISTRY }}/carpool-matching:${{ github.sha }} \
          --dns-name-label carpool-matching-${{ github.run_number }} \
          --ports 8000 \
          --location ${{ env.LOCATION }} \
          --os-type Linux \
          --cpu 0.5 \
          --memory 1 \
          --restart-policy Always \
          --registry-login-server ${{ env.REGISTRY }} \
          --registry-username ${{ env.ACR_NAME }} \
          --registry-password $(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv) \
          --environment-variables \
            USERS_SERVICE_URL=http://carpool-users-${{ github.run_number }}.eastus.azurecontainer.io:8000 \
            RIDES_SERVICE_URL=http://carpool-rides-${{ github.run_number }}.eastus.azurecontainer.io:8000 \
            RABBITMQ_HOST=rabbitmq.containerinstances.io

    - name: Display service URLs
      run: |
        echo "🚀 Deployment completed successfully!"
        echo ""
        echo "Service URLs:"
        echo "Users Service: http://carpool-users-${{ github.run_number }}.eastus.azurecontainer.io:8000"
        echo "Rides Service: http://carpool-rides-${{ github.run_number }}.eastus.azurecontainer.io:8000"
        echo "Matching Service: http://carpool-matching-${{ github.run_number }}.eastus.azurecontainer.io:8000"
        echo "Payments Service: http://carpool-payments-${{ github.run_number }}.eastus.azurecontainer.io:8000"
        echo "RabbitMQ Management: http://carpool-rabbitmq-${{ github.run_number }}.eastus.azurecontainer.io:15672"
        echo ""
        echo "API Documentation:"
        echo "Users API: http://carpool-users-${{ github.run_number }}.eastus.azurecontainer.io:8000/docs"
        echo "Rides API: http://carpool-rides-${{ github.run_number }}.eastus.azurecontainer.io:8000/docs"
        echo "Matching API: http://carpool-matching-${{ github.run_number }}.eastus.azurecontainer.io:8000/docs"
        echo "Payments API: http://carpool-payments-${{ github.run_number }}.eastus.azurecontainer.io:8000/docs"

    - name: Health Check
      run: |
        echo "Performing health checks..."
        sleep 30
        
        services=("users" "rides" "matching" "payments")
        
        for service in "${services[@]}"; do
          url="http://carpool-${service}-${{ github.run_number }}.eastus.azurecontainer.io:8000/health"
          echo "Checking $service service health..."
          
          # Try health check with timeout
          if timeout 30 curl -f "$url" >/dev/null 2>&1; then
            echo "✅ $service service is healthy"
          else
            echo "⚠️ $service service health check failed or timed out"
          fi
        done 